[globals]
; Autoload search path for app classes (controllers, models).
AUTOLOAD=../app/

; Template search path.
UI=../app/views/

; Framework cache directory (must be writable).
TEMP=../tmp/

; Log directory (must be writable).
LOGS=../logs/

; Database connection (adjust to your environment).
DB_DSN=mysql:host=localhost;port=3306;dbname=game;charset=utf8mb4
DB_USER=root
DB_PASS=

; Default timezone.
TZ=UTC

[debug]
; Set to 3 for verbose stack traces while developing, 0 in production.
dev=3
